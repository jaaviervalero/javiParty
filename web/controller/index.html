<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbfcfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>javiParty · Mando</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Pantalla de inicio: el primer toque desbloquea vibración y pantalla completa. -->
<section id="start" class="screen">
  <h1 class="logo"><span>javi</span><b>Party</b></h1>
  <p class="dots"><i></i><i></i><i></i><i></i></p>
  <button id="startBtn" class="big" data-i18n="tapToPlay">Toca para jugar</button>
  <p id="startHint" class="hint" data-i18n="sameWifi">Tienes que estar en el mismo Wi-Fi que la tele.</p>
</section>

<!-- Mensajes: conectando, sala llena, sin conexión. -->
<section id="status" class="screen hidden">
  <div class="spinner"></div>
  <p id="statusText" class="status-text"></p>
  <button id="retryBtn" class="big hidden" data-i18n="retry">Reintentar</button>
</section>

<!-- El mando. -->
<main id="pad" class="hidden">
  <header class="bar">
    <div id="badge" class="badge"><span id="badgeNum">1</span></div>
    <div class="who">
      <div id="playerName" class="player-name"></div>
      <div id="net" class="net"></div>
    </div>
    <button class="small" data-btn="-" aria-label="−">−</button>
    <button class="small" data-btn="+" aria-label="+">+</button>
  </header>

  <section class="controls">
    <div class="left">
      <div id="dpad" class="dpad" aria-label="cruceta">
        <span class="arrow up"></span><span class="arrow right"></span>
        <span class="arrow down"></span><span class="arrow left"></span>
        <span class="hub"></span>
      </div>
      <div id="stick" class="stick hidden" aria-label="stick">
        <div id="knob" class="knob"></div>
      </div>
      <div id="leftLabel" class="label"></div>
    </div>

    <div class="right">
      <div class="face">
        <div class="slot slot-b"><button class="face-btn b" data-btn="B">B</button><span class="label" data-for="B"></span></div>
        <div class="slot slot-a"><button class="face-btn a" data-btn="A">A</button><span class="label" data-for="A"></span></div>
        <div class="slot slot-1"><button class="face-btn n" data-btn="1">1</button><span class="label" data-for="1"></span></div>
        <div class="slot slot-2"><button class="face-btn n" data-btn="2">2</button><span class="label" data-for="2"></span></div>
      </div>
    </div>
  </section>
</main>

<script src="controller.js"></script>
</body>
</html>
